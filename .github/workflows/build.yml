name: Build BOK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          test -s index.html || { echo "ERROR: index.html is missing or empty"; exit 1; }
          test -s icon.png || { echo "ERROR: icon.png is missing or empty"; exit 1; }
          mkdir -p www assets
          cp index.html www/index.html
          convert icon.png -resize 1024x1024^ -gravity center -background white -extent 1024x1024 assets/icon.png

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap init BOK com.bok.app --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BOK-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
